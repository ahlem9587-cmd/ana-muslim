name: im_muslim
description: أنا مسلم | I'm Muslim
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.2+1
  record: ^6.2.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  geolocator: ^14.0.2

  adhan: ^2.0.0+1

  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^5.1.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/quran-uthmani.txt
    - assets/app_icon.png
    - assets/hisn_almuslim.json
    - assets/sahih_al_bukhari_ahadith.utf8.csv
    - assets/sahih_muslim_ahadith.utf8.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
