name: Build Ana Muslim APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android

      # ============================================================
      # نسخ ملف الأذان إلى Android ليُستخدم كصوت للإشعار
      # ============================================================

      - name: Add Adhan sound to Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/audio/Beautiful_adhan.ogg android/app/src/main/res/raw/beautiful_adhan.ogg

      # ============================================================
      # صلاحيات Android
      # ============================================================

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = """
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          """

          if "android.permission.POST_NOTIFICATIONS" not in text:
              text = text.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          path.write_text(text)
          PY

      # ============================================================
      # Core Library Desugaring
      # ============================================================

      - name: Enable Core Library Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              if "compileOptions {" in text:
                  text = text.replace(
                      "compileOptions {",
                      """compileOptions {
              isCoreLibraryDesugaringEnabled = true""",
                      1
                  )
              else:
                  text += """

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
          }
          """

          if "coreLibraryDesugaring(" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      """dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")""",
                      1
                  )
              else:
                  text += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """

          path.write_text(text)
          PY

      # ============================================================
      # Flutter dependencies
      # ============================================================

      - name: Get Flutter dependencies
        run: flutter pub get

      # ============================================================
      # App Icon
      # ============================================================

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # ============================================================
      # Build APK
      # ============================================================

      - name: Build Release APK
        run: flutter build apk --release

      # ============================================================
      # رفع APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: im-muslim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
