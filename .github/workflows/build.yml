name: Build Ana Muslim APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --project-name im_muslim .

      - name: Set app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="I\'m Muslim"',
              s,
              count=1
          )

          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: im-muslim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
